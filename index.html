    <style>
        /* Farben nach CD-Handbuch D15 (marke/farben/farben.css) */
        :root {
            --doebeling-portwein: #78022d;
            --doebeling-tinte: #22262b;
            --doebeling-papier: #ffffff;
            --doebeling-nacht: #0e1114;
            --doebeling-hellgrau: #e7e7e8;
            --grund: var(--doebeling-papier);
            --schrift: var(--doebeling-tinte);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --grund: var(--doebeling-nacht);
                --schrift: var(--doebeling-papier);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
            padding: 3rem 1.5rem 1.5rem;
            background: var(--grund);
            color: var(--schrift);
            font-family: Biome, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3rem;
        }
        /* Trenner: Linie in Hellgrau, außerhalb der Schutzzone des Logos */
        .trenner {
            width: 8rem;
            height: 1px;
            margin: 0;
            border: 0;
            background: var(--doebeling-hellgrau);
        }
        .logo { display: block; line-height: 0; }
        .logo img { max-width: 100%; height: auto; }
        /* Mindestgrößen und Schutzzone (0,339 × Kachelseite) nach CD-Handbuch */
        .logo img { width: min(600px, calc(100vw - 6rem)); }
        @media (max-width: 640px) {
            .logo img { width: min(316px, calc(100vw - 5rem)); }
        }
        .cta {
            display: inline-block;
            padding: 0.9rem 2rem;
            /* Kachelform: Ecken oben links und unten rechts gerundet */
            border-radius: 0.9rem 0 0.9rem 0;
            background: var(--doebeling-portwein);
            color: var(--doebeling-papier);
            font-size: 1.1rem;
            font-weight: 400;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .cta:hover, .cta:focus-visible { opacity: 0.85; }
        footer { margin-top: 3rem; font-size: 0.85rem; opacity: 0.6; }
        footer a { color: var(--schrift); text-decoration: none; }
        footer a:hover, footer a:focus-visible { text-decoration: underline; }
        footer span { margin: 0 0.6em; }
    </style>
</head>
<body>

<main>

<a class="logo" href="https://www.Doebeling.de" title="DÖBELING Projektbüro">
    <picture>
        <source media="(max-width: 640px) and (prefers-color-scheme: dark)" srcset="assets/D15-steh-dunkel-ohne-grund.svg">
        <source media="(max-width: 640px)" srcset="assets/D15-steh-hell.svg">
        <source media="(prefers-color-scheme: dark)" srcset="assets/D15-quer-dunkel-ohne-grund.svg">
        <img src="assets/D15-quer-hell.svg" width="600" height="128" alt="DÖBELING Projektbüro">
    </picture>
</a>

<a class="cta" href="https://github.com/DOEBELING">Show Projects on GitHub</a>
