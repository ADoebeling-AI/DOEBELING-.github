    <style>
        /* Brand colours from the corporate design manual (marke/farben/farben.css) */
        :root {
            --port-wine: #78022d;
            --ink: #22262b;
            --paper: #ffffff;
            --night: #0e1114;
            --light-grey: #e7e7e8;
            --background: var(--paper);
            --text: var(--ink);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: var(--night);
                --text: var(--paper);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
            padding: 3rem 1.5rem 1.5rem;
            background: var(--background);
            color: var(--text);
            font-family: Biome, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* One column as wide as the logo; divider and button start on the
           wordmark's left edge (28.62 % of the logo width in D15-quer) */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3rem;
            width: min(600px, calc(100vw - 6rem));
            --wordmark-left: 28.62%;
        }
        @media (max-width: 640px) {
            /* stacked logo: the wordmark starts on the logo's left edge */
            .brand { width: min(316px, calc(100vw - 5rem)); --wordmark-left: 0%; }
            /* stacked logo is symmetric, so the button sits on its centre axis */
            .brand .cta { align-self: center; margin-left: 0; }
        }
        /* Divider: light grey line across the wordmark's width, outside the logo's clear space */
        .divider {
            width: calc(100% - var(--wordmark-left));
            height: 1px;
            margin: 0 0 0 var(--wordmark-left);
            border: 0;
            background: var(--light-grey);
        }
        .logo { display: block; width: 100%; line-height: 0; }
        .logo img { max-width: 100%; height: auto; }
        /* Logo width follows the minimum sizes and the clear space (0.339 × tile side) of the CD manual */
        .logo img { width: 100%; }
        .cta {
            display: inline-block;
            margin-left: var(--wordmark-left);
            padding: 0.9rem 2rem;
            /* Tile shape: top-left and bottom-right corners rounded */
            border-radius: 0.9rem 0 0.9rem 0;
            background: var(--port-wine);
            color: var(--paper);
            font-size: 1.1rem;
            font-weight: 400;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .cta:hover, .cta:focus-visible { opacity: 0.85; }
        footer { margin-top: 3rem; font-size: 0.85rem; opacity: 0.6; }
        footer a { color: var(--text); text-decoration: none; }
        footer a:hover, footer a:focus-visible { text-decoration: underline; }
        footer span { margin: 0 0.6em; }
    </style>
</head>
<body>

        <source media="(max-width: 640px)" srcset="assets/logo-stacked-light.svg">

</a>
